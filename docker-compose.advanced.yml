# Hardened single-container deployment. Mirrors the minimal default but adds
# the optional hardening keys (read-only root filesystem, a bounded /tmp tmpfs,
# no-new-privileges). The embedded MX edge stages in memory, so it needs no
# writable staging mount.
#
#   docker compose -f docker-compose.advanced.yml up -d
services:
  mailmoose:
    image: mailmoose:latest
    build: .
    restart: unless-stopped
    env_file: .env
    # MX receiver is configured in Admin -> MX receiver (Included or Remote),
    # not with environment variables.
    volumes:
      - ./data:/data
    ports:
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:8082:8082"
      - "0.0.0.0:25:2525"
    # The image starts as root so the in-process privilege drop can chown a
    # fresh root-owned ./data and shed to the runtime user before the database
    # is opened. read_only + /tmp tmpfs + no-new-privileges are compatible with
    # that flow: the only filesystem writes are under the bind-mounted ./data
    # and under /tmp, and no setuid binaries are exec'd after the drop.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    # Hardenable, not required: for an internet-exposed deployment you may also
    # drop all capabilities and force a strict non-root user. These two are
    # opt-in because they conflict with the in-process root-then-drop: a strict
    # `user:` skips the boot chown and a fresh rootful-Docker ./data would fail
    # to open, `cap_drop: [ALL]` removes the setuid/setgid/chown capabilities
    # the drop requires, and the embedded edge cannot be spawned under a
    # separate uid. With `user:`/`cap_drop:` set, choose Remote in Admin -> MX
    # receiver and run the separate mailmoose-mx container; Included is
    # unavailable in a strictly non-root core.
    #
    #   cap_drop: [ALL]
    #   user: "${MAILMOOSE_RUN_UID:-65532}:${MAILMOOSE_RUN_GID:-65532}"
