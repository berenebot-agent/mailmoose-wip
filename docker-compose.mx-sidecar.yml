# Sidecar MX deployment: the edge in its own container from its own image
# (mailmoose-mx), no /data mount and no app key. This is the strongest isolation
# (separate filesystem and network namespaces) and is what the MX_ENABLE=remote
# mode expects.
#
#   docker compose -f docker-compose.mx-sidecar.yml up -d
#
# Set DIALMX_CORE_KEY in .env; the core connects to the receiver using that key.
services:
  mailmoose:
    image: mailmoose:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The core opens a bearer-authenticated HTTP/2 session to the receiver.
      MX_ENABLE: remote
      MX_RECEIVER_URL: http://mailmoose-mx:8443
      DIALMX_CORE_KEY: ${DIALMX_CORE_KEY:?set DIALMX_CORE_KEY in .env}
    volumes:
      - ./data:/data
    ports:
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:8082:8082"

  mailmoose-mx:
    image: mailmoose-mx:latest
    build:
      context: .
      dockerfile: Dockerfile.mx
    restart: unless-stopped
    environment:
      DIALMX_MODE: single
      DIALMX_CORE_KEY: ${DIALMX_CORE_KEY:?set DIALMX_CORE_KEY in .env}
      MX_HOSTNAME: ${MX_HOSTNAME:-mailmoose-mx}
    ports:
      - "0.0.0.0:25:2525"
    # The edge image already runs as a non-root user and stages in memory, so no
    # user:/read_only: overrides are required.
    security_opt:
      - no-new-privileges:true
