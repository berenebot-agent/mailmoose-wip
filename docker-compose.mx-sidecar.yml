# Sidecar MX deployment: the receiver in its own container from its own image
# (mailmoose-mx), no /data mount and no app key. This is the strongest isolation
# (separate filesystem and network namespaces) and is what the core's Remote MX
# receiver mode expects.
#
#   docker compose -f docker-compose.mx-sidecar.yml up -d
#
# The receiver takes its configuration from the environment block below (its own
# container only). The core does not: after starting, sign in as the system
# administrator, open Admin -> MX receiver, choose Remote, enter the URL
# http://mailmoose-mx:8443 and the same DIALMX_CORE_KEY value as the bearer key,
# then save. Never give the receiver the core's .env, /data or app key.
services:
  mailmoose:
    image: mailmoose:latest
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:8082:8082"

  mailmoose-mx:
    image: mailmoose-mx:latest
    build:
      context: .
      dockerfile: Dockerfile.mx
    restart: unless-stopped
    environment:
      DIALMX_MODE: single
      DIALMX_CORE_KEY: ${DIALMX_CORE_KEY:?set DIALMX_CORE_KEY in .env}
      MX_HOSTNAME: ${MX_HOSTNAME:-mailmoose-mx}
    ports:
      - "0.0.0.0:25:2525"
    # The edge image already runs as a non-root user and stages in memory, so no
    # user:/read_only: overrides are required.
    security_opt:
      - no-new-privileges:true
