name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal tests dialmx)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build -buildvcs=false ./cmd/... ./dialmx/cmd/...
      - run: go test -race -count=1 -timeout=60s ./...
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:latest
      # Separate edge image for the sidecar/remote MX deployment (MX_ENABLE=remote).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mx
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}-mx:latest
      # Standalone Dial MX receiver (core dials out over HTTPS/2; see docs/DIALMX.md).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dialmx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}-dialmx:latest
