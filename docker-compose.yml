# Build-from-source single-container deployment (see CONTRIBUTING.md for the
# toolchain). For a pull-and-run quickstart using the prebuilt
# ghcr.io/dellarb/mailmoose image, see the README.
#
# Direct SMTP (MX) ingress is ON by default: the embedded edge listens
# internally on :2525, published here on host port 25. Comment the :25 mapping
# out (or set MX_ENABLE=false in .env) if you receive mail only through a
# webhook provider (Mailgun, Cloudflare Email Routing, Resend).
services:
  mailmoose:
    image: mailmoose:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose default. Override with MX_ENABLE=false (or remote) in .env.
      MX_ENABLE: "${MX_ENABLE:-true}"
      # First-run administrator, bootstrap-only. Prefer a Docker secret:
      #   INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # and add `secrets: [admin_password]` below. Ignored once a user exists.
      #INITIAL_ADMIN_EMAIL: admin@example.com
      #INITIAL_ADMIN_PASSWORD: "${MAILMOOSE_ADMIN_PASSWORD}"
    volumes:
      - ./data:/data
    ports:
      # :8081 = API + web UI + webhook delivery connector.
      - "0.0.0.0:8081:8081"
      # :8082 = dedicated inbound listener (webhook connectors, plus the MX
      # resolve/ingest routes when MX is enabled).
      - "0.0.0.0:8082:8082"
      # :25 = direct SMTP when using this as an MX receiver (MX_ENABLE=true|remote).
      - "0.0.0.0:25:2525"
