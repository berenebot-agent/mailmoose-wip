services:
  gatehouse:
    image: gatehouse-mail:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Run the direct-SMTP (MX) edge inside this container. Turn receiving on
      # with MX_RECEIVE_ENABLED=true in .env; set MX_EMBEDDED=false here for a
      # sidecar/remote core that runs the edge separately.
      MX_EMBEDDED: ${MX_EMBEDDED:-true}
    volumes:
      - ./data:/data
    ports:
      # :8081 = API + web UI + webhook delivery connector.
      - "0.0.0.0:8081:8081"
      # :8082 = inbound webhook connector for delivery only. 
      # If using Web+API on LAN only can increase security by only exposing this to public internet.
      - "0.0.0.0:8082:8082"
      # :25 = direct smtp if using this as mx receiver
      - "0.0.0.0:25:2525"
