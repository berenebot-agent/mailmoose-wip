# Build-from-source single-container deployment (see CONTRIBUTING.md for the
# toolchain). For a pull-and-run quickstart using the prebuilt
# ghcr.io/dellarb/mailmoose image, see the README.
#
# Direct SMTP (MX) ingress is configured in the UI, not with environment
# variables: sign in as the system administrator and set Admin -> MX receiver to
# Included (this deployment runs the receiver on :2525) or Remote (a separate
# receiver). Host port 25 is commented out by default: uncomment the :25 mapping
# only when this deployment is an Included MX receiver reached from the public
# internet. Leave it commented if you receive mail only through a webhook
# provider (Mailgun, Cloudflare Email Routing, Resend).
#
# Project name pinned explicitly. Without this, Compose derives it from the
# directory basename, so a checkout whose parent directory is also named
# "repo" would collide with any sibling project and make each project see the
# other's containers as orphans, tearing them down with `--remove-orphans`.
name: mailmoose

services:
  mailmoose:
    container_name: mailmoose
    image: mailmoose:latest
    build: .
    restart: unless-stopped
    env_file: .env
    # System administrator credentials: when set in .env they are authoritative
    # and rotate the stored login on restart. Prefer a Docker secret by adding an
    # `environment:` block with ADMIN_PASSWORD_FILE and a `secrets:` entry below.
    # MX receiver settings are configured in Admin -> MX receiver, not here.
    volumes:
      - ./data:/data
    ports:
      # :8081 = API + web UI + webhook delivery connector.
      - "0.0.0.0:8081:8081"
      # Optional dedicated webhook listener: uncomment to publish its port.
      # Keep commented when DEDICATED_RECEIVER_ENABLE=false to free the host port.
      - "0.0.0.0:${DEDICATED_RECEIVER_PORT:-8082}:${DEDICATED_RECEIVER_PORT:-8082}"
      # :25 = direct SMTP when using this as an Included MX receiver. Uncomment
      # to publish it (and set Admin -> MX receiver to Included).
      # - "0.0.0.0:25:2525"
