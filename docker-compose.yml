services:
  gatehouse-mail:
    image: gatehouse-mail:latest
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      #Note that 2 ports are listened by default to allow exposing only the inbound
      #webhook reciever to internet if desired and keeping the API and WebUI on LAN
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:8082:8082"
