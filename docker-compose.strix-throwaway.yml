# Throwaway MailMoose instance for Strix live-app testing.
#
# Disposable: its own project name, its own empty bind-mounted data dir, and its
# own ports. It never touches the production ./data and never joins the
# production network, so a live attack here cannot reach real mail.
#
#   docker compose -p mailmoose-strix -f docker-compose.strix-throwaway.yml up -d
#   docker compose -p mailmoose-strix -f docker-compose.strix-throwaway.yml down -v
#
# The bind mount lives under tests/ so it stays inside the repo and out of the
# rest of the tree; tests/strix/ is gitignored.
services:
  mailmoose:
    image: mailmoose:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    container_name: mailmoose-strix
    environment:
      MODE: selfhosted
      # Deliberately NOT FORCE_HTTPS and NOT TRUSTED_PROXIES: the throwaway must
      # boot cleanly regardless of the proxy question, so the scan tests the app
      # rather than the deployment's TLS termination.
      BASE_URL: http://mailmoose-strix:8081
      # Throwaway scan-instance credentials. Not committed: a literal credential
      # in the tree trips secret scanners even when it is worthless. Supply them
      # via the environment (e.g. `set -a; . tests/strix/scan.env; set +a`
      # before `docker compose up`, with tests/strix/scan.env gitignored).
      # tests/strix/mint_scan_keys.sh bootstraps the same instance and can
      # generate this file.
      ADMIN_EMAIL: "${MAILMOOSE_STRIX_ADMIN_EMAIL:?set MAILMOOSE_STRIX_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${MAILMOOSE_STRIX_ADMIN_PASSWORD:?set MAILMOOSE_STRIX_ADMIN_PASSWORD}"
      APP_ENCRYPTION_KEY: "${MAILMOOSE_STRIX_APP_ENCRYPTION_KEY:?set MAILMOOSE_STRIX_APP_ENCRYPTION_KEY}"
    volumes:
      # Bind mount (never a named volume), inside the repo, gitignored.
      - ./tests/strix/data:/data
    ports:
      # Host-published for the key-minting steps only. The scan itself targets
      # the container by name on the mailmoose_default network.
      - "127.0.0.1:8091:8081"
      - "127.0.0.1:8092:8082"
    networks:
      - mailmoose_default
      # Also joined to the strix compose network so Strix's sandbox can reach
      # this instance by container name WITHOUT changing STRIX_DOCKER_SANDBOX_NETWORK
      # (the sandbox lives on strix_default, which is proven working with Caido).
      - strix_default

networks:
  # Explicit name: keeps the throwaway's own network separate from production.
  mailmoose_default:
    name: mailmoose_default
  # Created by the strix compose project; referenced here as external so this
  # file does not try to manage it.
  strix_default:
    external: true
